<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234F46E5'><path d='M3 3h18v18H3V3zm16 16V5H5v14h14zM7 7h10v2H7V7zm0 4h10v2H7v-2zm0 4h7v2H7v-2z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QuickBill - Cloud Billing, Inventory & POS Management Console" />
    <meta name="netlify-drawer" content="disable" />
    <meta name="netlify-disable-drawer" content="true" />
    <title>QuickBill Admin & POS Console</title>
    <script>
      // Forcefully remove any Netlify deploy preview badge or drawer before rendering or printing
      (function() {
        function purgeNetlify() {
          var els = document.querySelectorAll('netlify-drawer, #netlify-drawer, .netlify-badge, [class*="netlify"], [id*="netlify"], [data-netlify], [data-netlify-drawer], a[href*="netlify.com"], iframe[src*="netlify"]');
          for (var i = 0; i < els.length; i++) {
            try { els[i].remove(); } catch (e) { els[i].style.display = 'none'; }
          }
        }
        if (typeof window !== 'undefined') {
          window.addEventListener('DOMContentLoaded', purgeNetlify);
          window.addEventListener('beforeprint', purgeNetlify);
          if (typeof MutationObserver !== 'undefined') {
            var obs = new MutationObserver(purgeNetlify);
            obs.observe(document.documentElement, { childList: true, subtree: true });
          }
        }
      })();
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
