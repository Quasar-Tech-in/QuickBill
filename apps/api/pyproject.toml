[project]
name = "quickbill-api"
version = "1.0.0"
description = "QuickBill API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.28.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "motor>=3.3.2,<4.0.0",
    "pymongo>=4.6.2,<5.0.0",
    "pyjwt>=2.8.0,<3.0.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.1",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.1",
    "httpx>=0.27.0",
    "pillow>=10.2.0",
    "reportlab>=3.6.13,<4.0.0",
    "qrcode>=7.4.2",
    "mangum>=0.17.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
