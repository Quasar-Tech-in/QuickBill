[build]
  base = "apps/web"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NETLIFY_PREVIEW_DRAWER = "false"

[context.production.environment]
  NETLIFY_PREVIEW_DRAWER = "false"

[context.deploy-preview.environment]
  NETLIFY_PREVIEW_DRAWER = "false"

[context.branch-deploy.environment]
  NETLIFY_PREVIEW_DRAWER = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
